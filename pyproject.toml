[project]
name = "pokefetch"
version = "0.1.0"
description = "FastAPI project to fetch Pokemon"
authors = [
    { name = "Benjamin Davies", email = "benjamin@the-davies.net" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.143.0",
]

[project.scripts]
pokefetch = "pokefetch:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.fastapi]
entrypoint = "pokefetch.main:app"