name: Check Formatting with Ruff

on:
  pull_request:
    branches:
    - main
    - develop

jobs:
  ruff:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - uses: astral-sh/setup-uv@v5

    - name: Run Ruff
      run: |
        uvx ruff check .
        uvx ruff format --check .
