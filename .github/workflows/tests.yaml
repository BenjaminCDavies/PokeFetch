name: Run Tests

on:
  pull_request:
    branches:
    - main
    - develop

jobs:
  pytest:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true

    - uses: actions/setup-python@v5
      with:
        python-version: "3.14"

    - name: Install dependencies
      run: uv sync --dev

    - name: Run tests
      run: uv run pytest
